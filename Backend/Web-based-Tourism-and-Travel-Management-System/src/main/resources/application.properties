# ==========================================
# EXPLORE LANKA - Web-based Tourism & Travel Management System
# ==========================================
spring.application.name=explore-lanka
server.port=${PORT:3000}

# ---------- MySQL (database is created automatically) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:explore_lanka_sys}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:yenu@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Colombo

# ---------- Session ----------
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Demo data (users for all 8 roles, packages, hotels, ...) ----------
app.seed-demo-data=true

# ---------- Image uploads (admin forms) ----------
# Saved outside the jar so uploads survive rebuilds; served at /uploads/**
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Forgot password emails ----------
# Gmail SMTP: use an App Password (Google Account > Security > 2-Step Verification > App passwords),
# NOT your normal Gmail password. Leave MAIL_USERNAME empty to print the OTP code in the console instead.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
