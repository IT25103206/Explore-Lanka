<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Special Offers · Explore Lanka</title>
    <link rel="icon" href="/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container section">
    <div class="section-head">
        <div><div class="eyebrow">Promotions</div><h1>Special offers</h1></div>
        <p>Copy a code and enter it on the final step of your booking. Only currently running offers are shown.</p>
    </div>
    <div class="cards" id="offers"></div>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/shared-cards.js"></script>
<script>
(function () {
    EL.publicLayout("offers");
    EL.$("#offers").innerHTML = EL.skeleton(2);
    EL.api("/api/public/promotions").then((list) => {
        EL.$("#offers").innerHTML = list.map(Cards.offerCard).join("") || EL.emptyState("There are no running offers right now - check back soon!", "tag");
        Cards.bindCopy(EL.$("#offers"));
    }).catch(EL.toastError);
})();
</script>
</body>
</html>
